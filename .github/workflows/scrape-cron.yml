# Every-15-min scrape cron driven by GitHub Actions, 24/7.
#
# Why GitHub Actions and not Vercel cron? Vercel Hobby is limited to 2 daily
# crons. GitHub Actions free tier gives 2000 minutes/month — enough room for
# 96 calls/day across multiple platforms.
#
# Why every 15 min and 24/7 (no Paris-hour gate)?
#   Paying customers (commercial launch 2026-05-23) expect <1h data freshness
#   around the clock, not just during European business hours. The previous
#   `'13 * * * *'` + 9-21 Paris gate left a 12h dead window every night where
#   account data drifted stale.
#
# Why split LinkedIn off?
#   LinkedIn's upstream Edge function is the slowest platform (~3-5s/account,
#   frequently rate-limited). Running it at 15-min cadence with TikTok/YouTube
#   means LinkedIn slow accounts starve the fast platforms. LinkedIn has its
#   own hourly workflow (scrape-linkedin.yml).
#
# Each call to /api/cron/scrape-* runs inside a Vercel serverless function
# (60s budget). The endpoints scrape staleest accounts first and stamp
# `"_timeout":true` when they bail early — we then loop up to 3 passes per
# call so a single GH job can drain ~290 accounts × 3 = ~870 accounts per
# 15-min window per platform group.
#
# Budget @ 96 calls/day:
#   - Worst case (3 passes × ~30s + curl overhead): ~120s/job × 96 = ~192 min/day
#   - Typical (1-2 passes after queue catches up): ~60s/job × 96 = ~96 min/day
#   - Monthly: ~2880-5760 min worst case. With concurrency:cancel-in-progress=false
#     and the in-app staleness queue, most calls clear in 1 pass after warmup.
#   - LinkedIn workflow adds ~360 min/month (24 calls/day × ~30s × 30 days).
#   - Health-monitor adds ~150 min/month.
#   - Total stays under 2000-min free tier in steady state; spikes during
#     onboarding may temporarily push higher.
#
# Setup:
#   1. Repo Settings → Secrets and variables → Actions → New secret
#      Name: CRON_SECRET (same value as Vercel env var)
#   2. Manual trigger: Actions tab → "Scrape cron (every 15 min)" → Run workflow.

name: Scrape cron (every 15 min)

on:
  schedule:
    # Every 15 min, around the clock. Offset by 2 min from :00/:15/:30/:45 to
    # avoid GH Actions platform-load delays at quarter-hour boundaries.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which crons to trigger'
        required: false
        default: 'all'
        type: choice
        options: [all, instagram, tiktok-youtube]

# Allow overlapping passes — the in-app staleness queue + _timeout: true resume
# pattern handles duplicate calls gracefully (re-entrant; already-fresh accounts
# are skipped via the cadence check).
concurrency:
  group: scrape-cron
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Pick platforms
        id: which
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'all' }}"
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "→ scraping: $PLATFORMS"

      - name: Trigger /api/cron/scrape-instagram
        if: steps.which.outputs.platforms == 'all' || steps.which.outputs.platforms == 'instagram'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://trackinglab.online' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repo secrets"
            exit 1
          fi
          echo "── /api/cron/scrape-instagram ──"
          # Up to 3 passes: covers cases where pass 1 timed out before
          # finishing the staleest accounts. Pass 2/3 picks them up.
          for pass in 1 2 3; do
            echo "Pass $pass:"
            HTTP=$(curl -sS -w "\n[HTTP %{http_code} in %{time_total}s]\n" \
                        -H "Authorization: Bearer $CRON_SECRET" \
                        --max-time 90 \
                        "${APP_URL}/api/cron/scrape-instagram")
            echo "$HTTP"
            if echo "$HTTP" | grep -q '"_timeout":true'; then
              echo "→ pass $pass timed out, will retry"
            else
              echo "→ pass $pass clean, skipping further passes"
              break
            fi
            sleep 3
          done

      - name: Trigger /api/cron/scrape-tiktok-youtube
        if: steps.which.outputs.platforms == 'all' || steps.which.outputs.platforms == 'tiktok-youtube'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://trackinglab.online' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repo secrets"
            exit 1
          fi
          echo "── /api/cron/scrape-tiktok-youtube ──"
          # TT/YT have heavier yt-dlp work; up to 3 passes cover ~870 accounts
          # per 15-min window with 16-thread concurrency.
          for pass in 1 2 3; do
            echo "Pass $pass:"
            HTTP=$(curl -sS -w "\n[HTTP %{http_code} in %{time_total}s]\n" \
                        -H "Authorization: Bearer $CRON_SECRET" \
                        --max-time 90 \
                        "${APP_URL}/api/cron/scrape-tiktok-youtube")
            echo "$HTTP"
            if echo "$HTTP" | grep -q '"_timeout":true'; then
              echo "→ pass $pass timed out, will retry"
            else
              echo "→ pass $pass clean, skipping further passes"
              break
            fi
            sleep 3
          done

      - name: Summary
        if: always()
        run: |
          echo "## Scrape cron summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: \`${{ steps.which.outputs.platforms || 'all' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (Paris: $(TZ='Europe/Paris' date +'%H:%M:%S'))" >> $GITHUB_STEP_SUMMARY
