# Hourly scrape cron driven by GitHub Actions, gated to 9h-21h Paris time.
#
# Why GitHub Actions and not Vercel cron? Vercel Hobby is limited to 2 daily
# crons; we want hourly refresh during the user's active hours. GitHub Actions
# free tier gives 2000 minutes/month — way more than enough.
#
# Why "every hour UTC + Paris-hour gate" instead of a fixed UTC range?
#   GH Actions cron runs in UTC only. Paris is UTC+1 in winter, UTC+2 in summer
#   (DST). A fixed UTC range would drift by 1 hour twice a year. The gate step
#   below checks the actual Paris hour and skips the run if outside 9-21,
#   handling DST automatically. The wasted runs (outside business hours) exit
#   in ~5s each and consume <2 min/month of GH Actions budget.
#
# Each call to /api/cron/scrape-* runs inside a Vercel serverless function
# (60s budget). The endpoints scrape staleest accounts first, so even if one
# call hits the 55s ceiling, the next pass covers what was missed.
#
# Setup:
#   1. Repo Settings → Secrets and variables → Actions → New secret
#      Name: CRON_SECRET (same value as Vercel env var)
#   2. Manual trigger: Actions tab → "Scrape cron (hourly)" → Run workflow.

name: Scrape cron (hourly)

on:
  schedule:
    # Every hour UTC. The Paris-hour gate below filters to 9-21 local.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which crons to trigger (manual runs ignore the time gate)'
        required: false
        default: 'all'
        type: choice
        options: [all, instagram, tiktok-youtube]

# Cancel any older still-running invocation when a new one starts. Avoids
# overlapping cron calls when a previous run is taking unusually long.
concurrency:
  group: scrape-cron
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Paris business-hours gate
        id: gate
        run: |
          # Skip scheduled runs outside 9h-21h Paris time. Manual workflow_dispatch
          # always proceeds (user explicitly clicked "Run workflow").
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "→ manual trigger, gate bypassed"
            echo "proceed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PARIS_HOUR=$(TZ='Europe/Paris' date +%H | sed 's/^0//')
          PARIS_HOUR=${PARIS_HOUR:-0}
          echo "→ Paris hour: ${PARIS_HOUR}h"
          if [ "$PARIS_HOUR" -ge 9 ] && [ "$PARIS_HOUR" -le 21 ]; then
            echo "→ inside business window (9-21h), proceeding"
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "→ outside business window, skipping"
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Pick platforms
        id: which
        if: steps.gate.outputs.proceed == 'true'
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'all' }}"
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "→ scraping: $PLATFORMS"

      - name: Trigger /api/cron/scrape-instagram
        if: steps.gate.outputs.proceed == 'true' && (steps.which.outputs.platforms == 'all' || steps.which.outputs.platforms == 'instagram')
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://app.trackinglab.online' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repo secrets"
            exit 1
          fi
          echo "── /api/cron/scrape-instagram ──"
          # Two passes back-to-back: covers cases where pass 1 timed out before
          # finishing the staleest accounts. Pass 2 picks them up.
          for pass in 1 2; do
            echo "Pass $pass:"
            HTTP=$(curl -sS -w "\n[HTTP %{http_code} in %{time_total}s]\n" \
                        -H "Authorization: Bearer $CRON_SECRET" \
                        --max-time 90 \
                        "${APP_URL:-https://app.trackinglab.online}/api/cron/scrape-instagram")
            echo "$HTTP"
            if echo "$HTTP" | grep -q '"_timeout":true'; then
              echo "→ pass $pass timed out, will retry"
            else
              echo "→ pass $pass clean, skipping further passes"
              break
            fi
            sleep 5
          done

      - name: Trigger /api/cron/scrape-tiktok-youtube
        if: steps.gate.outputs.proceed == 'true' && (steps.which.outputs.platforms == 'all' || steps.which.outputs.platforms == 'tiktok-youtube')
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://app.trackinglab.online' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repo secrets"
            exit 1
          fi
          echo "── /api/cron/scrape-tiktok-youtube ──"
          # TT/YT have heavier yt-dlp work; we typically need 2-3 passes to cover
          # 20+ accounts within Vercel's 60s budget per call.
          for pass in 1 2 3; do
            echo "Pass $pass:"
            HTTP=$(curl -sS -w "\n[HTTP %{http_code} in %{time_total}s]\n" \
                        -H "Authorization: Bearer $CRON_SECRET" \
                        --max-time 90 \
                        "${APP_URL:-https://app.trackinglab.online}/api/cron/scrape-tiktok-youtube")
            echo "$HTTP"
            if echo "$HTTP" | grep -q '"_timeout":true'; then
              echo "→ pass $pass timed out, will retry"
            else
              echo "→ pass $pass clean, skipping further passes"
              break
            fi
            sleep 5
          done

      - name: Summary
        if: always()
        run: |
          echo "## Scrape cron summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Gate: \`${{ steps.gate.outputs.proceed }}\` (Paris business hours 9-21)" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: \`${{ steps.which.outputs.platforms || 'skipped' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (Paris: $(TZ='Europe/Paris' date +'%H:%M:%S'))" >> $GITHUB_STEP_SUMMARY
