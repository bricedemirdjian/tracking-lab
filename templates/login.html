<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Lab - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260409">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f7;
        }
        .login-card {
            background: #fff;
            border: 1px solid #e0e0e5;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0,0,0,.1);
        }
        .login-card .logo-icon {
            width: 72px;
            height: 72px;
            background: transparent;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .login-card h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0d0d0d;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .login-card .login-subtitle {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 36px;
        }
        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 32px;
            background: #0d0d0d;
            color: white;
            border: none;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            width: 100%;
        }
        .btn-google:hover {
            background: #333;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
        }
        .btn-google svg {
            width: 20px;
            height: 20px;
        }
        .login-footer {
            margin-top: 32px;
            font-size: 12px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-icon">
                <svg width="64" height="64" viewBox="0 0 40 40" fill="none">
                    <defs><radialGradient id="loginLogoDot" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="1"/><stop offset="45%" stop-color="#FF69B4" stop-opacity="0.5"/><stop offset="100%" stop-color="#FF69B4" stop-opacity="0"/></radialGradient></defs>
                    <circle cx="20" cy="20" r="20" fill="url(#loginLogoDot)"/>
                    <circle cx="20" cy="20" r="7" fill="#FF69B4"/>
                </svg>
            </div>
            <h1>Tracking Lab</h1>
            <p class="login-subtitle">Analytics pour créateurs de contenus et entreprises</p>
            <a href="/login/google" class="btn-google">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Se connecter avec Google
            </a>
            <p class="login-footer">Connectez-vous pour accéder à votre espace de tracking</p>
        </div>
    </div>
</body>
</html>
