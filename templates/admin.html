<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tracking Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260409">
    <style>
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .admin-header h1 { font-size: 24px; color: var(--text-primary); letter-spacing: -0.3px; }
        .users-table { width: 100%; border-collapse: collapse; }
        .users-table th { text-align: left; padding: 12px 16px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
        .users-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-size: 14px; }
        .users-table tr:hover td { background: var(--bg-secondary); }
        .user-row-avatar { width: 36px; height: 36px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
        .user-name-cell { display: flex; align-items: center; gap: 10px; }
        .user-name { font-weight: 600; color: var(--text-primary); }
        .user-email { font-size: 12px; color: var(--text-muted); }
        .badge-role { padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-admin { background: var(--warning); color: #000; }
        .badge-user { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .badge-blocked { background: var(--accent); color: #fff; }
        .badge-active { background: rgba(52,199,89,0.1); color: var(--success); border: 1px solid rgba(52,199,89,0.2); }
        .admin-actions { display: flex; gap: 8px; }
        .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
        .admin-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; box-shadow: var(--shadow); }
        .admin-stat-value { font-size: 32px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px; }
        .admin-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="12" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="8" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="4" stroke="#fff" stroke-width="2"/>
                <circle cx="16" cy="16" r="1.8" fill="#fff"/>
                <line x1="16" y1="2" x2="16" y2="8" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="16" y1="24" x2="16" y2="30" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="2" y1="16" x2="8" y2="16" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="24" y1="16" x2="30" y2="16" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round"/>
            </svg></div>
            <div>
                <h1>Tracking Lab</h1>
                <span class="subtitle">Administration</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="/" class="btn btn-secondary btn-sm">Dashboard</a>
            <div class="user-info">
                {% if user.avatar_url %}
                <img src="{{ user.avatar_url }}" class="user-avatar" alt="" referrerpolicy="no-referrer">
                {% endif %}
                <span class="user-name">{{ user.name or user.email }}</span>
                <a href="/logout" class="btn btn-secondary btn-sm" title="Deconnexion">&#x2190;</a>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Gestion des utilisateurs</h1>
        </div>

        <div class="admin-stats">
            <div class="admin-stat-card">
                <div class="admin-stat-value" id="totalUsers">-</div>
                <div class="admin-stat-label">Utilisateurs</div>
            </div>
            <div class="admin-stat-card">
                <div class="admin-stat-value" id="totalAccounts">-</div>
                <div class="admin-stat-label">Comptes trackes</div>
            </div>
            <div class="admin-stat-card">
                <div class="admin-stat-value" id="totalVideos">-</div>
                <div class="admin-stat-label">Videos en base</div>
            </div>
        </div>

        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Role</th>
                        <th>Statut</th>
                        <th>Comptes</th>
                        <th>Videos</th>
                        <th>Inscription</th>
                        <th>Derniere connexion</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.status === 401) { window.location.href = '/login'; return; }
                if (res.status === 403) { window.location.href = '/'; return; }
                const users = await res.json();

                document.getElementById('totalUsers').textContent = users.length;
                document.getElementById('totalAccounts').textContent = users.reduce((s, u) => s + (u.account_count || 0), 0);
                document.getElementById('totalVideos').textContent = users.reduce((s, u) => s + (u.video_count || 0), 0);

                const tbody = document.getElementById('usersTableBody');
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">Aucun utilisateur</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(u => {
                    const avatar = u.avatar_url ? `<img src="${u.avatar_url}" class="user-row-avatar" referrerpolicy="no-referrer">` : '';
                    const roleBadge = u.role === 'admin' ? '<span class="badge-role badge-admin">Admin</span>' : '<span class="badge-role badge-user">User</span>';
                    const statusBadge = u.blocked ? '<span class="badge-role badge-blocked">Bloque</span>' : '<span class="badge-role badge-active">Actif</span>';
                    const created = u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '-';
                    const lastLogin = u.last_login ? new Date(u.last_login).toLocaleDateString('fr-FR') : '-';

                    let actions = '';
                    if (u.role !== 'admin') {
                        if (u.blocked) {
                            actions += `<button class="btn btn-secondary btn-sm" onclick="unblockUser(${u.id})">Debloquer</button>`;
                        } else {
                            actions += `<button class="btn btn-secondary btn-sm" style="color:var(--warning)" onclick="blockUser(${u.id})">Bloquer</button>`;
                        }
                        actions += ` <button class="btn btn-secondary btn-sm" style="color:var(--accent)" onclick="deleteUser(${u.id}, '${(u.name || u.email).replace(/'/g, "\\'")}')">Supprimer</button>`;
                    } else {
                        actions = '<span style="color:var(--text-muted);font-size:12px">-</span>';
                    }

                    return `<tr>
                        <td><div class="user-name-cell">${avatar}<div><div class="user-name">${u.name || '-'}</div><div class="user-email">${u.email}</div></div></div></td>
                        <td>${roleBadge}</td>
                        <td>${statusBadge}</td>
                        <td>${u.account_count || 0}</td>
                        <td>${u.video_count || 0}</td>
                        <td>${created}</td>
                        <td>${lastLogin}</td>
                        <td><div class="admin-actions">${actions}</div></td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error('Error loading users:', e);
            }
        }

        async function blockUser(id) {
            await fetch(`/api/admin/block/${id}`, { method: 'POST' });
            loadUsers();
        }

        async function unblockUser(id) {
            await fetch(`/api/admin/unblock/${id}`, { method: 'POST' });
            loadUsers();
        }

        async function deleteUser(id, name) {
            if (!confirm(`Supprimer l'utilisateur "${name}" et toutes ses donnees ? Cette action est irreversible.`)) return;
            await fetch(`/api/admin/delete/${id}`, { method: 'POST' });
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
